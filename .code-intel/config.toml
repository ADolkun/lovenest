[backend]
root = "backend"
package = "app"
app = "app.main:app"
lock = "backend/uv.lock"
python_version_file = "backend/.python-version"

[backend.capture]
python = "backend/.venv/bin/python"
env = { AGENTS_ENABLED = "true", ONCHAIN_ENABLED = "true", AGENTS_MCP_JWT_SECRET = "test-secret-not-for-production", AGENTS_BUILTIN_MCP_URL = "http://test-mcp:8765/mcp", SECRET_KEY = "synthetic-test-signing-key-not-for-production", CREDENTIALS_DIRECTORY = "", OIDC_ENABLED = "false", OIDC_EXISTING_USER_LINK_MODE = "disabled" }

[frontend]
root = "frontend"
tsconfig = "frontend/tsconfig.app.json"
lockfile = "frontend/package-lock.json"

[[frontend.clients]]
kind = "instance"
module = "frontend/src/lib/api.ts"
export = "api"
base_path = "/api"

[[frontend.clients]]
kind = "instance"
package = "axios"

[[frontend.clients]]
kind = "global"
name = "fetch"
url_arg = 0
init_arg = 1
same_origin_only = true

[frontend.pages]
kind = "react-router"
modules = ["frontend/src/App.tsx"]
public_dir = "frontend/public"

[symbols]
primary_prefixes = ["frontend/src/components/", "frontend/src/lib/", "frontend/src/hooks/", "backend/app/"]

[docs]
scope = ["docs/**/*.md", "AGENTS.md", "CONTEXT.md", "README.md", "CONTRIBUTING.md", "extras/**/*.md", ".claude/rules/**/*.md", ".claude/skills/**/*.md"]
route_prefixes = ["/api"]

[docs.reachability]
root = "docs/README.md"
include = ["docs/**/*.md"]
exclude = []

[[docs.rules]]
paths = ["docs/automatic-bank-sync.md", "docs/rfc-235-investment-ledger.md"]
checks = ["links"]
reason = "Upstream-owned docs: fixing their code references would edit upstream files on every sync."

[[docs.ignore]]
file = "README.md"
kind = "path"
text = "tools/deps"
reason = "Shorthand for tools and dependencies in a mise comment, not a path; the line is upstream's."

[agents]
rules_dir = ".claude/rules"
skills_dir = ".claude/skills"
instruction_map = { file = "AGENTS.md", heading = "Scoped instruction map" }
