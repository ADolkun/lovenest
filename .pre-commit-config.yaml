# Runs the same backend checks as CI, before you push. Optional.
#
#   uv sync --directory backend --locked  # installs the locked dev group
#   uv tool run prek install
#
# Run by hand: uv tool run prek run --all-files
#
# Hooks run through the same uv project and lock as CI.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: uv run --directory backend --locked ruff check .
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: migration-chain
        name: alembic chain (backend)
        entry: uv run --directory backend --locked python scripts/check_migration_chain.py
        language: system
        files: ^backend/alembic/versions/
        # The chain is a property of the whole directory, not of one file.
        pass_filenames: false

      - id: ty
        name: ty (backend)
        entry: uv run --directory backend --locked ty check .
        language: system
        types: [python]
        files: ^backend/
        # Type errors propagate: editing b.py can break a.py, so check the
        # whole project rather than just the staged files.
        pass_filenames: false
