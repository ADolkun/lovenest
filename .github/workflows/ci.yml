name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check CI selection and detect changes
        id: backend-changes
        working-directory: .
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

      - name: Skip backend tests
        if: steps.backend-changes.outputs.run_backend == 'false'
        run: echo "No backend-relevant changes; skipping backend test suite."

      - name: Set up Python
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: actions/setup-python@v7
        with:
          # Single source of truth with the Docker image: CI must test the
          # same interpreter the backend ships with.
          python-version-file: backend/.python-version

      - name: Set up uv
        if: steps.backend-changes.outputs.run_backend != 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version
            extras/tax/uv.lock
            extras/tax/pyproject.toml
            extras/tax/.python-version

      - name: Install dependencies
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv sync --locked --group dev

      - name: Lint with Ruff
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ruff check .

      - name: Type check with ty
        if: steps.backend-changes.outputs.run_backend != 'false'
        run: uv run --no-sync ty check .

      - name: Check tax planner lock and tests
        if: steps.backend-changes.outputs.run_backend != 'false'
        working-directory: extras/tax
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -v

      - name: Run tests with coverage
        if: steps.backend-changes.outputs.run_backend != 'false'
        env:
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        run: |
          uv run --no-sync pytest -n auto --dist loadfile --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        if: ${{ always() && steps.backend-changes.outputs.run_backend != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main' && steps.backend-changes.outputs.run_backend != 'false'
        id: coverage
        run: |
          COVERAGE=$(uv run --no-sync python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100))")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.repository == 'securo-finance/securo' && github.ref == 'refs/heads/main' && steps.backend-changes.outputs.run_backend != 'false'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ae627b744aaa2ba89d850ea541c311be
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest

    steps:
      # No `ref:` override, so on a pull request this is the merge with the
      # base branch. That is the whole point: a revision id that only clashes
      # once both sides are together is visible here and nowhere else.
      - uses: actions/checkout@v7

      - name: Check the Alembic revision chain
        run: python3 backend/scripts/check_migration_chain.py

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & Build
        run: npm run build

      - name: Run tests
        run: npm test

  helm-checks:
    name: Helm Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect helm-relevant changes
        id: helm-changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_helm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^1 HEAD)"

          if echo "$changed_files" | grep -Eq '^(charts/securo/.*|\.github/workflows/ci\.yml)$'; then
            echo "run_helm=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_helm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip helm checks
        if: steps.helm-changes.outputs.run_helm != 'true'
        run: echo "No helm-relevant changes; skipping helm lint."

      - name: Set up Helm
        if: steps.helm-changes.outputs.run_helm == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Lint Helm Chart
        if: steps.helm-changes.outputs.run_helm == 'true'
        run: helm lint charts/securo

      - name: Validate Helm Chart with Kubeconform
        if: steps.helm-changes.outputs.run_helm == 'true'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

          helm template securo-test charts/securo | kubeconform -summary -strict
