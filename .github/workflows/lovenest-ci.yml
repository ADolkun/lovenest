name: lovenest CI

on:
  pull_request:
    branches: [lovenest, main]
  push:
    branches: [lovenest]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ponytail: retain service startup on skipped PRs; split detection if its cost warrants it.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check CI selection and detect changes
        id: changes
        working-directory: .
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

      - name: Report backend checks not needed
        if: steps.changes.outputs.run_backend == 'false'
        run: echo "No backend-relevant changes; skipping backend checks."

      - name: Set up Python
        if: steps.changes.outputs.run_backend != 'false'
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        if: steps.changes.outputs.run_backend != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version
            extras/tax/uv.lock
            extras/tax/pyproject.toml
            extras/tax/.python-version

      - name: Install dependencies
        if: steps.changes.outputs.run_backend != 'false'
        run: uv sync --locked --group dev

      - name: Lint with Ruff
        if: steps.changes.outputs.run_backend != 'false'
        run: uv run --no-sync ruff check .

      # Upstream runs this in its own workflow, which only fires on `main`.
      # This fork renumbers every upstream migration onto its own head, so the
      # clash the guard exists for is more likely here, not less.
      - name: Check the Alembic revision chain
        if: steps.changes.outputs.run_backend != 'false'
        run: uv run --no-sync python scripts/check_migration_chain.py

      - name: Type check with ty
        if: steps.changes.outputs.run_backend != 'false'
        run: uv run --no-sync ty check .

      - name: Check tax planner lock and tests
        if: steps.changes.outputs.run_backend != 'false'
        working-directory: extras/tax
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -v

      - name: Run tests
        if: steps.changes.outputs.run_backend != 'false'
        env:
          EVIDENCE_TEST_DATABASE_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
        # worksteal, not loadfile: no fixture is module-scoped, and loadfile pins
        # a whole heavy file to one worker while the others sit idle.
        run: uv run --no-sync pytest -n auto --dist worksteal --durations=25 -ra -W error

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check CI selection and detect changes
        id: changes
        working-directory: .
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

      - name: Report frontend checks not needed
        if: steps.changes.outputs.run_frontend == 'false'
        run: echo "No frontend-relevant changes; skipping frontend checks."

      - name: Set up Node.js
        if: steps.changes.outputs.run_frontend != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.run_frontend != 'false'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.run_frontend != 'false'
        run: npm run lint -- --max-warnings=0

      - name: Type check & build
        if: steps.changes.outputs.run_frontend != 'false'
        run: npm run build

      - name: Run tests
        if: steps.changes.outputs.run_frontend != 'false'
        run: npm test

  dev-scripts:
    name: Dev scripts self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/dev
          persist-credentials: false

      - name: Test sync-deps.sh
        run: python3 -I tools/dev/test_sync_deps.py

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: .code-intel/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Check docs against the code
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel doc-check

  code-intel-verify:
    name: Code-intel verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check CI selection and detect changes
        id: changes
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

      - name: Report code-intel checks not needed
        if: steps.changes.outputs.run_backend == 'false' && steps.changes.outputs.run_frontend == 'false'
        run: echo "No backend or frontend changes; skipping code-intel verify."

      - name: Set up uv
        if: steps.changes.outputs.run_backend != 'false' || steps.changes.outputs.run_frontend != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: .code-intel/requirements.txt

      - name: Set up Node.js
        if: steps.changes.outputs.run_backend != 'false' || steps.changes.outputs.run_frontend != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up code-intel
        if: steps.changes.outputs.run_backend != 'false' || steps.changes.outputs.run_frontend != 'false'
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Verify the analyzers
        if: steps.changes.outputs.run_backend != 'false' || steps.changes.outputs.run_frontend != 'false'
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel verify

      - name: Summarize the analysis
        if: ${{ !cancelled() && (steps.changes.outputs.run_backend != 'false' || steps.changes.outputs.run_frontend != 'false') }}
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel summary >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm (lint + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check CI selection and detect changes
        id: changes
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

      - name: Report helm checks not needed
        if: steps.changes.outputs.run_helm == 'false'
        run: echo "No helm-relevant changes; skipping helm checks."

      - name: Set up Helm
        if: steps.changes.outputs.run_helm != 'false'
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install kubeconform
        if: steps.changes.outputs.run_helm != 'false'
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Lint Helm chart
        if: steps.changes.outputs.run_helm != 'false'
        run: helm lint charts/securo

      - name: Validate rendered manifests
        if: steps.changes.outputs.run_helm != 'false'
        # Explicit bash enables pipefail; the default shell would let a failed
        # `helm template` feed kubeconform empty input and pass.
        shell: bash
        run: helm template securo-test charts/securo | kubeconform -summary -strict
