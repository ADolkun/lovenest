name: lovenest CI

on:
  pull_request:
    branches: [lovenest, main]
  push:
    branches: [lovenest]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.run_backend }}
      frontend: ${{ steps.select.outputs.run_frontend }}
      helm: ${{ steps.select.outputs.run_helm }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check CI selection and detect changes
        id: select
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

  backend-static:
    name: Backend static checks
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version
            extras/tax/uv.lock
            extras/tax/pyproject.toml
            extras/tax/.python-version

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check the library capture
        working-directory: .
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel capture --check

      - name: Lint with Ruff
        run: uv run --no-sync ruff check .

      # Upstream runs this in its own workflow, which only fires on `main`.
      # This fork renumbers every upstream migration onto its own head, so the
      # clash the guard exists for is more likely here, not less.
      - name: Check the Alembic revision chain
        run: uv run --no-sync python scripts/check_migration_chain.py

      - name: Type check with pyrefly
        run: uv run --no-sync pyrefly check

      - name: Check tax planner lock and tests
        working-directory: extras/tax
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -v

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          EVIDENCE_TEST_DATABASE_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # worksteal, not loadfile: no fixture is module-scoped, and loadfile pins
        # a whole heavy file to one worker while the others sit idle.
        run: uv run --no-sync pytest -n auto --dist worksteal --durations=25 -ra -W error

  frontend-static:
    name: Frontend static checks
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check & build
        run: npm run build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  dev-scripts:
    name: Dev scripts self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/dev
            tools/deploy
          persist-credentials: false

      - name: Test sync-deps.sh
        run: python3 -I tools/dev/test_sync_deps.py

      - name: Test self-hosting setup and pull deployment
        run: python3 -I tools/deploy/test_deploy.py

  docs-check:
    name: Docs Check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: .code-intel/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Check docs against the code
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel doc-check

  code-intel-verify:
    name: Code-intel verify
    needs: changes
    if: needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            .code-intel/requirements.txt
            backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Verify the analyzers
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel verify

      - name: Summarize the analysis
        if: ${{ !cancelled() }}
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel summary >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm (lint + kubeconform)
    needs: changes
    if: needs.changes.outputs.helm != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Lint Helm chart
        run: helm lint charts/securo

      - name: Validate rendered manifests
        # Explicit bash enables pipefail; the default shell would let a failed
        # `helm template` feed kubeconform empty input and pass.
        shell: bash
        run: helm template securo-test charts/securo | kubeconform -summary -strict

  # The one required check. A job skipped because its area did not change counts
  # as passing; a failed, cancelled or never-run job does not.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - changes
      - backend-static
      - backend-tests
      - frontend-static
      - frontend-tests
      - dev-scripts
      - docs-check
      - code-intel-verify
      - helm
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
