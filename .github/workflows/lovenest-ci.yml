name: lovenest CI

on:
  pull_request:
    branches: [lovenest, main]
  push:
    branches: [lovenest]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: |
          pip install -q uv==0.12.1
          uv export --frozen --all-extras --no-emit-project -o /tmp/requirements-dev.txt
          pip install --require-hashes -r /tmp/requirements-dev.txt
          pip install --no-deps -e .

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with ty
        run: ty check .

      - name: Run tests
        run: pytest -n auto

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

      - name: Run tests
        run: npm test
