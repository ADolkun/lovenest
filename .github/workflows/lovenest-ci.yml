name: lovenest CI

on:
  pull_request:
    branches: [lovenest, main]
  push:
    branches: [lovenest]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # gh run cancel
    outputs:
      backend: ${{ steps.select.outputs.run_backend }}
      frontend: ${{ steps.select.outputs.run_frontend }}
      helm: ${{ steps.select.outputs.run_helm }}

    steps:
      # No concurrency group, because GitHub holds a PR's next run until the previous
      # one has finished cancelling, which took up to 77 s and delayed every update.
      - name: Cancel the runs this one supersedes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow lovenest-ci.yml --event pull_request --branch "$HEAD_REF" \
            --json databaseId,status \
            --jq ".[] | select(.databaseId < $GITHUB_RUN_ID and .status != \"completed\") | .databaseId" \
            | while read -r id; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check CI selection and detect changes
        id: select
        run: |
          python3 .github/ci/test_changes.py
          python3 .github/ci/changes.py

  backend-static:
    name: Backend static checks
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/lovenest' }}
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version
            extras/tax/uv.lock
            extras/tax/pyproject.toml
            extras/tax/.python-version

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check the library capture
        working-directory: .
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel capture --check

      - name: Lint with Ruff
        run: uv run --no-sync ruff check .

      # Upstream runs this in its own workflow, which only fires on `main`.
      # This fork renumbers every upstream migration onto its own head, so the
      # clash the guard exists for is more likely here, not less.
      - name: Check the Alembic revision chain
        run: uv run --no-sync python scripts/check_migration_chain.py

      - name: Type check with pyrefly
        run: uv run --no-sync pyrefly check

      - name: Check tax planner lock and tests
        working-directory: extras/tax
        run: |
          uv sync --locked
          uv run --no-sync python -m unittest discover -v

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/lovenest' }}
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          EVIDENCE_TEST_DATABASE_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # worksteal, not loadfile: no fixture is module-scoped, and loadfile pins
        # a whole heavy file to one worker while the others sit idle.
        run: uv run --no-sync pytest -n auto --dist worksteal --durations=25 -ra -W error

  frontend-static:
    name: Frontend static checks
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # setup-node's own cache would save on every pull request; this saves on lovenest only.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Save the npm cache
        if: github.ref == 'refs/heads/lovenest' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check & build
        run: npm run build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # setup-node's own cache would save on every pull request; this saves on lovenest only.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Save the npm cache
        if: github.ref == 'refs/heads/lovenest' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm test -- --shard="$SHARD"

  dev-scripts:
    name: Dev scripts self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These stdlib-only tests read the production Compose and Dockerfile
          # contracts too. Non-cone mode includes those files, not the full app.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/dev/
            /tools/deploy/
            /.env.example
            /docker-compose.prod.yml
            /backend/Dockerfile
          persist-credentials: false

      - name: Test sync-deps.sh
        run: python3 -I tools/dev/test_sync_deps.py

      - name: Test self-hosting setup and pull deployment
        run: python3 -I tools/deploy/test_deploy.py

  docs-check:
    name: Docs Check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/lovenest' }}
          cache-dependency-glob: .code-intel/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Check docs against the code
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel doc-check

  code-intel-verify:
    name: Code-intel verify
    needs: changes
    if: needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/lovenest' }}
          cache-dependency-glob: |
            .code-intel/requirements.txt
            backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Verify the analyzers
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel verify

  code-intel-summary:
    name: Code-intel summary
    needs: changes
    if: needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/lovenest' }}
          cache-dependency-glob: |
            .code-intel/requirements.txt
            backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Set up code-intel
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel setup

      - name: Summarize the analysis
        run: uv run --no-project --python 3.14 --with-requirements .code-intel/requirements.txt code-intel summary >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm (lint + kubeconform)
    needs: changes
    if: needs.changes.outputs.helm != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Lint Helm chart
        run: helm lint charts/securo

      - name: Validate rendered manifests
        # Explicit bash enables pipefail; the default shell would let a failed
        # `helm template` feed kubeconform empty input and pass.
        shell: bash
        run: helm template securo-test charts/securo | kubeconform -summary -strict

  # The fork's own workflows only: upstream's files are not ours to change, and they
  # would fail this audit. List a new fork-only workflow here when adding one.
  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false

      # The token enables the online audits (impostor commits, known-vulnerable actions).
      - name: Audit the fork's workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.32.0 --quiet .github/workflows/lovenest-ci.yml .github/workflows/clean-pr-caches.yml

  # The one required check. A job skipped because its area did not change counts
  # as passing; a failed, cancelled or never-run job does not.
  # !cancelled() rather than always(): a superseded run ends without a red gate.
  ci-gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs:
      - changes
      - backend-static
      - backend-tests
      - frontend-static
      - frontend-tests
      - dev-scripts
      - docs-check
      - code-intel-verify
      - code-intel-summary
      - helm
      - workflow-audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
