[project]
name = "securo-backend"
version = "0.16.6"
description = "Securo API - Personal Finance Manager"
requires-python = ">=3.14"
# These ranges express intent; CI and Docker install uv.lock with uv sync --locked.
# After changing dependencies, run
# scripts/lock.sh and commit the updated uv.lock — CI fails if it drifts.
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    # 2.1 is blocked by fastapi-users-db-sqlalchemy, which requires <2.1.
    "sqlalchemy>=2.0.57",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=50.0.2",
    "passlib[bcrypt]>=1.7.4",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
    "ofxparse>=0.21",
    "celery[redis]>=5.7.0",
    "aiofiles>=25.1.0",
    "redis[hiredis]>=8.1.0",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
    "yfinance>=1.8.0",
    "pgvector>=0.5.1",
    "pypdf>=6.21.4",
    # Invoice PDF rendering. ReportLab rather than an HTML-to-PDF engine on
    # purpose: WeasyPrint and its peers need pango, cairo and gdk-pixbuf in
    # the image, and this is a self-hosted product where every megabyte and
    # every native library is paid for by the person running it. ReportLab
    # ships pure-Python wheels, and Pillow (already present) covers the logo.
    "reportlab>=5.1.0",
    # Password-protected backups. The stdlib zipfile can only *read* the
    # legacy ZipCrypto scheme and cannot write an encrypted archive at all,
    # so AES-256 zips need this fork of it.
    "pyzipper>=0.4.0",
    # Bundled multilingual embedder — only imported on demand by the
    # agents knowledge-base path. ONNX runtime, ~120 MB model downloaded
    # on first use to /app/data/embedding_models. Users not on the
    # agents feature pay zero cost (the package is installed but never
    # imported).
    "fastembed>=0.9.1",
    # Resolve the host's IANA timezone when no app setting or TZ override exists.
    "tzlocal>=5.4.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "aiosqlite>=0.22.1",
    "pyrefly>=1.4.1",
    # uv.lock pins the resolved version; a new release lands via `lock.sh --upgrade`.
    "ruff>=0.17.3",
    "ty>=0.0.98",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "mcp_server"]
module-root = ""

[tool.setuptools.package-data]
# Ship the category taxonomy in wheels/non-editable installs; without this it
# only exists in editable (-e) installs and the backend crashes at import.
app = ["data/*.json"]

[tool.pytest.ini_options]
# Fail on configuration/marker typos, duplicate parameter IDs and unexpected
# xfail passes instead of silently weakening the suite.
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# FastAPI/Starlette route handlers run on SQLAlchemy's greenlet, so coverage.py
# must track greenlet (and thread) execution contexts — otherwise async endpoint
# bodies execute but their lines are never attributed, under-reporting every API module.
concurrency = ["greenlet", "thread"]
omit = [
    "app/cli.py",
    "app/worker.py",
    "app/tasks/*",
    "app/providers/pluggy.py",
    "app/providers/enable_banking.py",
    "app/providers/simplefin.py",
    "app/providers/market_price.py",
]

[tool.coverage.report]
fail_under = 60

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unused-ignore-comment = "error"

# pyrefly backs editor/agent LSP navigation only. ty is the type gate, so pyrefly's
# own type errors stay out of the IDE rather than competing with ty's verdict.
[tool.pyrefly]
python-version = "3.14"
disable-type-errors-in-ide = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Keep the lint contract explicit: Ruff's baseline plus selected correctness
# checks. Expand it deliberately rather than inheriting new release defaults.
select = [
    "E4", "E7", "E9", "F",
    # Stable correctness checks; avoid a mechanical style-only rewrite.
    "B006", "B012", "B016", "B019", "B020", "B022", "B026", "B029", "B033", "B034",
    "PLE",
]
ignore = ["E711", "E712"]
